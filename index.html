<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Página empresarial</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background: #111 url("fondo.jpg") center top / cover no-repeat fixed;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .veil {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: rgba(8, 10, 28, 0.28);
      pointer-events: none;
    }
    .card-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      padding: 24px;
      pointer-events: none;
    }
    .card {
      pointer-events: auto;
      width: min(94vw, 460px);
      background: #fff;
      color: #1b1b1f;
      border-radius: 18px;
      padding: 28px 24px 22px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 650;
      cursor: pointer;
      min-width: 100px;
    }
    .si { background: #2d6a4f; color: #fff; }
    .si:hover { background: #1b4332; }
    .no { background: #efeef5; color: #2a2a32; }
    .no:hover { background: #e0dfe8; }
    .mensaje {
      display: none;
      margin: 0;
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.45rem;
      line-height: 1.45;
      color: #3a2040;
    }
    .mensaje.show { display: block; }
    #aviso.hidden { display: none; }
  </style>
</head>
<body>
  <div class="veil"></div>
  <div class="card-wrap">
    <div class="card">
      <div id="aviso">
        <h1>Empezemos</h1>
        <div class="actions">
          <button class="si" id="btn-si" type="button">Sí</button>
          <button class="no" id="btn-no" type="button">No</button>
        </div>
      </div>
      <p class="mensaje" id="mensaje"></p>
    </div>
  </div>
  <script>
    var texto = "caiste inmunda jajaja te quiero mucho fasti";

    function mostrar() {
      document.getElementById("aviso").classList.add("hidden");
      var caja = document.getElementById("mensaje");
      caja.textContent = texto;
      caja.classList.add("show");
    }

    document.getElementById("btn-si").addEventListener("click", mostrar);
    document.getElementById("btn-no").addEventListener("click", mostrar);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BasePoint</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background: #111 url("fondo.jpg") center top / cover no-repeat fixed;
      display: grid;
      place-items: end center;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    .veil {
      position: fixed;
      inset: 0;
      background: rgba(8, 10, 28, 0.28);
    }
    .card {
      position: relative;
      z-index: 1;
      width: min(94vw, 460px);
      margin: 24px;
      background: #fff;
      color: #1b1b1f;
      border-radius: 18px;
      padding: 22px 22px 18px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.15rem;
    }
    p {
      margin: 0 0 16px;
      color: #4b4b55;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .actions { display: flex; gap: 10px; justify-content: flex-end; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 11px 18px;
      font-size: 0.95rem;
      font-weight: 650;
      cursor: pointer;
    }
    .ok { background: #6a35f5; color: #fff; }
    .ok:hover { background: #5926e6; }
    .no { background: #efeef5; color: #2a2a32; }
    .mensaje {
      display: none;
      margin: 8px 0 4px;
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.7rem;
      line-height: 1.35;
      color: #3a2040;
    }
    .mensaje.show { display: block; }
  </style>
</head>
<body>
  <div class="veil"></div>
  <div class="card">
    <div id="aviso">
      <h1>Usamos cookies</h1>
      <p>Acepta las cookies para continuar y guardar tus preferencias en este sitio.</p>
      <div class="actions">
        <button class="no" id="rechazar" type="button">Rechazar</button>
        <button class="ok" id="abrir" type="button">Aceptar cookies</button>
      </div>
    </div>
    <div class="mensaje" id="mensaje"></div>
  </div>
  <script>
    function mostrar() {
      var caja = document.getElementById("mensaje");
      var bytes = Uint8Array.from(atob("dGUgcXVpZXJvIG11Y2hvIGlubXVuZGE="), function (c) {
        return c.charCodeAt(0);
      });
      caja.textContent = new TextDecoder().decode(bytes);
      caja.classList.add("show");
      document.getElementById("aviso").style.display = "none";
    }
    document.getElementById("abrir").addEventListener("click", mostrar);
    document.getElementById("rechazar").addEventListener("click", mostrar);
  </script>
</body>
</html>
